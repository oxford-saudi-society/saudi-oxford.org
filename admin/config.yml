# Decap CMS — the committee's editing desk at https://ousss.org/admin/
# Sign-in uses GitHub through Netlify's OAuth provider (see README → "Committee desk").
backend:
  name: github
  repo: oxford-saudi-society/saudi-oxford.org
  branch: main
  base_url: https://api.netlify.com
  commit_messages:
    create: "Add {{collection}} “{{slug}}”"
    update: "Update {{collection}} “{{slug}}”"
    delete: "Delete {{collection}} “{{slug}}”"
    uploadMedia: "Upload “{{path}}”"
    deleteMedia: "Delete “{{path}}”"

site_url: https://ousss.org
display_url: https://ousss.org
logo_url: https://ousss.org/assets/seal-880.webp
media_folder: "src/assets/people"
public_folder: "/assets/people"
slug:
  encoding: "ascii"
  clean_accents: true

collections:
  - name: "settings"
    label: "Settings"
    description: "Fees, payment links, bank details, email and social accounts. Published on save."
    files:
      - name: "site"
        label: "Society settings"
        file: "src/content/settings.json"
        fields:
          - { label: "Society email (shown on the site)", name: "email", widget: "string", required: false, hint: "e.g. hello@ousss.org" }
          - { label: "Treasurer email (hardship fund, bank-transfer queries)", name: "treasurerEmail", widget: "string", required: false, hint: "e.g. treasurer@ousss.org" }
          - { label: "Membership email (applications, proof of nationality)", name: "membershipEmail", widget: "string", required: false, hint: "e.g. membership@ousss.org" }
          - { label: "President email", name: "presidentEmail", widget: "string", required: false, hint: "e.g. president@ousss.org" }
          - { label: "Where new membership applications are announced (committee inbox)", name: "committeeNotifyEmail", widget: "string", required: false }
          - { label: "Committee desk super admins (their email signs in as super admin)", name: "adminEmails", widget: "list", required: false }
          - { label: "Founded (year)", name: "founded", widget: "string", required: false }
          - label: "Membership fees"
            name: "fees"
            widget: "object"
            fields:
              - { label: "Student fee (£)", name: "student", widget: "number", value_type: "int", min: 0 }
              - { label: "Associate fee (£)", name: "associate", widget: "number", value_type: "int", min: 0 }
              - { label: "Fees confirmed (removes the [brackets])", name: "confirmed", widget: "boolean", default: false }
          - label: "Stripe payment links"
            name: "payLinks"
            widget: "object"
            fields:
              - { label: "Student (buy.stripe.com/…)", name: "student", widget: "string", required: false }
              - { label: "Associate (buy.stripe.com/…)", name: "associate", widget: "string", required: false }
          - label: "Bank account (for transfers)"
            name: "bank"
            widget: "object"
            fields:
              - { label: "Account name", name: "accountName", widget: "string" }
              - { label: "Sort code", name: "sortCode", widget: "string", required: false }
              - { label: "Account number", name: "accountNumber", widget: "string", required: false }
          - label: "Social accounts"
            name: "social"
            widget: "object"
            fields:
              - { label: "X (full link)", name: "x", widget: "string", required: false }
              - { label: "Facebook (full link)", name: "facebook", widget: "string", required: false }
              - { label: "LinkedIn (full link)", name: "linkedin", widget: "string", required: false }
              - { label: "Instagram handle", name: "instagram", widget: "string", required: false }
          - label: "Privacy notice"
            name: "privacy"
            widget: "object"
            fields:
              - { label: "Retention period (e.g. 'two years')", name: "retention", widget: "string", required: false }
              - { label: "Hosting provider named in the notice", name: "hosting", widget: "string", required: false }
              - { label: "Privacy notice version (date of the last change, e.g. 2026-11-08)", name: "version", widget: "string", required: false, hint: "Stored with every event registration so the committee knows which notice the person accepted" }
          - label: "Ideas board (Canny)"
            name: "ideas"
            widget: "object"
            fields:
              - { label: "Canny board token (Canny → Settings → Widget)", name: "cannyBoardToken", widget: "string", required: false, hint: "Embeds the board on the Ideas page" }
              - { label: "Hosted board link (e.g. https://oxford-saudi.canny.io/ideas)", name: "url", widget: "string", required: false, hint: "Shown as 'Open in a new tab'" }
              - { label: "Other provider embed link (optional)", name: "embedUrl", widget: "string", required: false, hint: "Any embeddable board page; used only if no Canny token" }
          - label: "Visitor analytics (Cloudflare Web Analytics)"
            name: "analytics"
            widget: "object"
            fields:
              - { label: "Site token (Cloudflare → Web Analytics → Manage site → JS snippet)", name: "cloudflareToken", widget: "string", required: false, hint: "Leave empty to collect nothing" }
          - { label: "Show the Supporters section", name: "showSupporters", widget: "boolean", default: false }
          - { label: "Site name", name: "siteName", widget: "object", fields: [ { label: "English", name: "en", widget: "string" }, { label: "Arabic", name: "ar", widget: "string" } ] }
          - { label: "Subtitle under the name (header and home page)", name: "subtitle", widget: "object", fields: [ { label: "English", name: "en", widget: "string", default: "University of Oxford" }, { label: "Arabic", name: "ar", widget: "string", default: "جامعة أكسفورد" } ] }
          - { label: "Domain", name: "domain", widget: "hidden", default: "https://ousss.org" }

  - name: "events"
    label: "Events"
    label_singular: "Event"
    description: "Titles, copy, dates and images of the programme. Status, capacity and registrations are managed in the events dashboard at /admin/events/."
    folder: "src/content/events"
    create: true
    format: "json"
    extension: "json"
    identifier_field: "slug"
    slug: "{{slug}}"
    summary: "{{order}} · {{title.en}} · {{startLocal}}"
    sortable_fields: ["order", "startLocal"]
    fields:
      - { label: "Stable ID (never change after publishing, e.g. oss-012)", name: "id", widget: "string", pattern: ["^oss-[0-9]{3}$", "format oss-000"] }
      - { label: "Short name for the link (letters and hyphens)", name: "slug", widget: "string", pattern: ["^[a-z0-9-]+$", "lowercase letters, digits and hyphens only"] }
      - { label: "Order in the programme", name: "order", widget: "number", value_type: "int", default: 99 }
      - { label: "Title", name: "title", widget: "object", fields: [ { label: "English", name: "en", widget: "string" }, { label: "Arabic", name: "ar", widget: "string" } ] }
      - { label: "Description", name: "description", widget: "object", fields: [ { label: "English", name: "en", widget: "text" }, { label: "Arabic", name: "ar", widget: "text" } ] }
      - { label: "Agenda", name: "agenda", widget: "object", required: false, fields: [ { label: "English (one item per line)", name: "en", widget: "list", required: false }, { label: "Arabic (one item per line)", name: "ar", widget: "list", required: false } ] }
      - { label: "Category", name: "category", widget: "select", options: [ { label: "Community", value: "community" }, { label: "Culture", value: "culture" }, { label: "Culture & religion", value: "culture-religion" }, { label: "Religion", value: "religion" }, { label: "Academic & careers", value: "academic-careers" }, { label: "Sports", value: "sports" } ] }
      - { label: "Start (Oxford local time)", name: "startLocal", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ss", date_format: "DD MMM YYYY", time_format: "HH:mm", picker_utc: false }
      - { label: "End (Oxford local time)", name: "endLocal", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ss", date_format: "DD MMM YYYY", time_format: "HH:mm", picker_utc: false }
      - { label: "Timezone", name: "timezone", widget: "hidden", default: "Europe/London" }
      - { label: "Venue", name: "venueKey", widget: "select", options: [ { label: "North Oxford Association — Annexe", value: "noa-annexe" }, { label: "North Oxford Association — Main Hall", value: "noa-main-hall" }, { label: "University Parks", value: "university-parks" }, { label: "To be announced", value: "tba" } ] }
      - { label: "Audience", name: "audience", widget: "select", options: [ { label: "All welcome", value: "public" }, { label: "Members only", value: "members" } ], default: "public" }
      - label: "Price"
        name: "price"
        widget: "object"
        fields:
          - { label: "Status", name: "status", widget: "select", options: [ { label: "Free", value: "free" }, { label: "To be announced", value: "tbd" } ], default: "free" }
          - { label: "Currency", name: "currency", widget: "hidden", default: "GBP" }
          - { label: "Amount in pence (free = 0)", name: "amountMinor", widget: "number", value_type: "int", required: false }
      - { label: "Booking required", name: "bookingRequired", widget: "boolean", default: true }
      - { label: "Initial registration mode (the dashboard overrides this once the event is live)", name: "registrationMode", widget: "select", options: [ { label: "None — no registration", value: "none" }, { label: "Interest only (not a booking)", value: "interest_only" }, { label: "Open", value: "open" }, { label: "Closed", value: "closed" } ], default: "interest_only" }
      - { label: "Initial status", name: "eventStatus", widget: "select", options: [ { label: "Proposed", value: "proposed" }, { label: "Confirmed", value: "confirmed" }, { label: "Postponed", value: "postponed" }, { label: "Cancelled", value: "cancelled" }, { label: "Completed", value: "completed" } ], default: "proposed" }
      - { label: "Visibility", name: "visibility", widget: "select", options: [ { label: "Published as a proposal", value: "published_as_proposal" }, { label: "Published", value: "published" }, { label: "Hidden", value: "hidden" } ], default: "published_as_proposal" }
      - { label: "Capacity (leave empty until the venue confirms)", name: "capacity", widget: "number", value_type: "int", required: false }
      - { label: "Waitlist when full", name: "waitlistEnabled", widget: "boolean", default: false }
      - { label: "Date notice", name: "dateNotice", widget: "object", fields: [ { label: "English", name: "en", widget: "string" }, { label: "Arabic", name: "ar", widget: "string" } ] }
      - label: "Image (square)"
        name: "image"
        widget: "object"
        fields:
          - { label: "Display image (1080×1080 webp under /assets/events/web/)", name: "web", widget: "image", media_folder: "/src/assets/events/web", public_folder: "/assets/events/web" }
          - { label: "Thumbnail (440×440 webp under /assets/events/thumbs/)", name: "thumb", widget: "image", media_folder: "/src/assets/events/thumbs", public_folder: "/assets/events/thumbs" }
          - { label: "Alt text", name: "alt", widget: "object", fields: [ { label: "English", name: "en", widget: "string" }, { label: "Arabic", name: "ar", widget: "string" } ] }
          - { label: "Credit", name: "credit", widget: "string", required: false }
          - { label: "Review note", name: "reviewNote", widget: "string", required: false }
          - { label: "Artwork approved by the committee", name: "approved", widget: "boolean", default: false }
      - { label: "Published", name: "published", widget: "boolean", default: true }

  - name: "faq"
    label: "FAQ"
    description: "Questions and answers shown on /faq/ (English) and /ar/faq/ (Arabic). Keep each answer short and factual; put official sources in the references."
    files:
      - name: "faq"
        label: "Questions & answers"
        file: "src/content/faq.json"
        fields:
          - { label: "Last reviewed (YYYY-MM-DD)", name: "updated", widget: "string", hint: "Shown at the foot of the page" }
          - { label: "Introduction", name: "intro", widget: "object", fields: [ { label: "English", name: "en", widget: "text" }, { label: "Arabic", name: "ar", widget: "text" } ] }
          - label: "Sections"
            name: "sections"
            widget: "list"
            summary: "{{fields.title.en}}"
            fields:
              - { label: "Section id (letters, digits, dashes — used in links)", name: "id", widget: "string", pattern: ["^[a-z0-9-]+$", "lower-case letters, digits and dashes only"] }
              - { label: "Title", name: "title", widget: "object", fields: [ { label: "English", name: "en", widget: "string" }, { label: "Arabic", name: "ar", widget: "string" } ] }
              - label: "Questions"
                name: "items"
                widget: "list"
                summary: "{{fields.q.en}}"
                fields:
                  - { label: "Question id (letters, digits, dashes — the link people share)", name: "id", widget: "string", pattern: ["^[a-z0-9-]+$", "lower-case letters, digits and dashes only"] }
                  - { label: "Question", name: "q", widget: "object", fields: [ { label: "English", name: "en", widget: "string" }, { label: "Arabic", name: "ar", widget: "string" } ] }
                  - { label: "Answer", name: "a", widget: "object", hint: "Plain text. A link is written as [words](https://…) or [words](#ideas) for a site page.", fields: [ { label: "English", name: "en", widget: "text" }, { label: "Arabic", name: "ar", widget: "text" } ] }
                  - { label: "Official references", name: "refs", widget: "list", required: false, summary: "{{fields.label}}", fields: [ { label: "Label (e.g. SACB: financial guarantees)", name: "label", widget: "string" }, { label: "Link (https://…)", name: "url", widget: "string", pattern: ["^https://", "must start with https://"] } ] }

  - name: "venues"
    label: "Venues"
    files:
      - name: "venues"
        label: "Proposed venues"
        file: "src/content/venues.json"
        fields:
          - label: "North Oxford Association — Annexe"
            name: "noa-annexe"
            widget: "object"
            fields: &venuefields
              - { label: "Key", name: "key", widget: "hidden" }
              - { label: "Name", name: "name", widget: "object", fields: [ { label: "English", name: "en", widget: "string" }, { label: "Arabic", name: "ar", widget: "string" } ] }
              - { label: "Type", name: "type", widget: "select", options: ["indoor", "outdoor"] }
              - { label: "Booking status", name: "bookingStatus", widget: "select", options: [ { label: "Not requested / unconfirmed", value: "not_requested_or_unconfirmed" }, { label: "Permission not checked", value: "permission_not_checked" }, { label: "Requested", value: "requested" }, { label: "Confirmed", value: "confirmed" } ] }
              - { label: "Official booking page", name: "officialBookingUrl", widget: "string", required: false }
              - { label: "Internal note", name: "locationNote", widget: "string", required: false }
              - { label: "Verified street address (shown only once confirmed)", name: "addressVerified", widget: "string", required: false }
              - { label: "Map link (shown only once confirmed)", name: "mapsUrl", widget: "string", required: false }
              - { label: "Accessibility note", name: "accessibilityNote", widget: "object", fields: [ { label: "English", name: "en", widget: "string", required: false }, { label: "Arabic", name: "ar", widget: "string", required: false } ] }
          - { label: "North Oxford Association — Main Hall", name: "noa-main-hall", widget: "object", fields: *venuefields }
          - { label: "University Parks", name: "university-parks", widget: "object", fields: *venuefields }

  - name: "people"
    label: "Community directory"
    label_singular: "Profile"
    folder: "src/content/people"
    create: true
    format: "json"
    extension: "json"
    identifier_field: "name"
    summary: "{{name}} · {{group}}"
    fields:
      - { label: "Full name", name: "name", widget: "string" }
      - { label: "Name in Arabic", name: "nameAr", widget: "string", required: false }
      - { label: "Group", name: "group", widget: "select", options: [ { label: "Current University of Oxford student", value: "student" }, { label: "Oxford alumni", value: "alumni" }, { label: "Working in Oxford", value: "associate" }, { label: "Oxford Brookes", value: "brookes" } ] }
      - { label: "College, department or employer", name: "college", widget: "string", required: false }
      - { label: "Headline", name: "headline", widget: "object", fields: [ { label: "English", name: "en", widget: "string" }, { label: "Arabic", name: "ar", widget: "string", required: false } ] }
      - { label: "Years at Oxford (e.g. 2019–2023)", name: "years", widget: "string", required: false }
      - { label: "About (up to 400 characters)", name: "bio", widget: "object", fields: [ { label: "English", name: "en", widget: "text", required: false }, { label: "Arabic", name: "ar", widget: "text", required: false } ] }
      - { label: "Interests / keywords", name: "interests", widget: "list", required: false, allow_add: true, field: { label: "Keyword", name: "keyword", widget: "string" } }
      - { label: "LinkedIn link", name: "linkedin", widget: "string", required: false }
      - { label: "Contact emails (up to 2)", name: "emails", widget: "list", required: false, max: 2, field: { label: "Email", name: "email", widget: "string" } }
      - { label: "WhatsApp numbers (up to 2, with country code)", name: "phones", widget: "list", required: false, max: 2, field: { label: "Number", name: "phone", widget: "string" } }
      - { label: "Photo (square)", name: "photo", widget: "image", required: false, allow_multiple: false }
      - { label: "Consent to public listing received (email or in writing)", name: "consentPublic", widget: "boolean", default: false, hint: "Do not publish without it." }
      - { label: "Published", name: "published", widget: "boolean", default: true }

  - name: "committees"
    label: "Committees"
    label_singular: "Committee year"
    folder: "src/content/committees"
    create: true
    format: "json"
    extension: "json"
    identifier_field: "term"
    slug: "{{term}}"
    summary: "{{term}}"
    fields:
      - { label: "Academic year (e.g. 2027–28)", name: "term", widget: "string" }
      - { label: "This is the current committee", name: "current", widget: "boolean", default: false }
      - label: "Members"
        name: "members"
        widget: "list"
        required: false
        summary: "{{fields.name}} — {{fields.role}}"
        fields:
          - { label: "Role", name: "role", widget: "select", options: [ { label: "President", value: "president" }, { label: "Vice President", value: "vice-president" }, { label: "Secretary", value: "secretary" }, { label: "Treasurer", value: "treasurer" }, { label: "Events Officer", value: "events" }, { label: "Social Secretary", value: "social" }, { label: "Media Officer", value: "media" }, { label: "Outreach Officer", value: "outreach" }, { label: "Committee member", value: "member" } ] }
          - { label: "Name", name: "name", widget: "string", required: false }
          - { label: "Name in Arabic", name: "nameAr", widget: "string", required: false }
          - { label: "College", name: "college", widget: "string", required: false }
